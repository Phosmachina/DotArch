---
- name: Install qimgv (Arch)
  ansible.builtin.shell: >  # noqa: command-instead-of-shell
    yay -Sy --noconfirm
    qimgv
    qtraw
    qt6-heic-image-plugin
    qt6-avif-image-plugin
  become: true
  become_user: '{{ ansible_user }}'
  changed_when: true
  when: ansible_facts.distribution == 'Archlinux'
  tags: [apps, qimgv]

- name: Remove Qt5-only HEIF plugin (wrong ABI for Qt6 qimgv)
  become: true
  community.general.pacman:
    name: qt-heif-image-plugin
    state: absent
  when: ansible_facts.distribution == 'Archlinux'
  tags: [apps, qimgv]

- name: Create qimgv config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/qimgv"
    state: directory
    mode: '0755'
  tags: [apps, qimgv, config]

- name: Copy Qimgv configuration
  ansible.builtin.copy:
    src: "files/home/.config/qimgv/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/qimgv/{{ item }}"
    mode: '0644'
  loop:
    - qimgv.conf
    - theme.conf
  tags: [apps, qimgv, config]
