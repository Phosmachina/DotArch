---
- name: Load encrypted secrets
  ansible.builtin.include_vars: secret.yml

# Install and configure Voxtype
- name: Install Voxtype dependencies (Arch)
  become: true
  community.general.pacman:
    name:
      - wtype
      - wl-clipboard
    state: present
  when: ansible_facts.distribution == 'Archlinux'
  tags: [apps, voxtype]

- name: Install Voxtype (AUR)
  ansible.builtin.shell: 'yay -Sy --noconfirm voxtype-bin'  # noqa: command-instead-of-shell
  args:
    creates: /usr/bin/voxtype
  changed_when: true
  tags: [apps, voxtype]

- name: Create Voxtype configuration directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/voxtype"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  tags: [apps, voxtype, config]

- name: Deploy Voxtype configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/voxtype/config.toml"
    mode: '0600' # Contains API key potentially
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  tags: [apps, voxtype, config]
