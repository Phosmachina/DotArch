---
- name: Install NetworkManager (Laptop)
  community.general.pacman:
    name: networkmanager
    state: present
  become: true
  when: target == 'laptop'
  tags: [system, network]

- name: Enable and Start NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started
  become: true
  when: target == 'laptop'
  tags: [system, network]
