---
- name: Install necessary packages
  community.general.pacman:
    name:
      - bluez-utils
      - bluez
      - bluez-obex
    state: present
  become: true

- name: Set Bluetooth auto-enable
  ansible.builtin.lineinfile:
    path: /etc/bluetooth/main.conf
    regexp: '^#?AutoEnable=true'
    line: 'AutoEnable=true'
    backrefs: true
    state: present
  become: true

- name: Enable bluetooth service to activate bluetooth on boot
  ansible.builtin.systemd:
    name: bluetooth.service
    enabled: true
    state: started
  become: true

- name: Install bluetuith (AUR)
  ansible.builtin.shell: 'yay -Sy --noconfirm bluetuith'  # noqa: command-instead-of-shell
  become: true
  become_user: '{{ ansible_user }}'
  changed_when: true
  tags: [system, bluetooth]
