---
# VPN configuration with WireGuard

- name: Install WireGuard packages
  community.general.pacman:
    name:
      - wireguard-tools
    state: present
  become: true
  tags: [system, vpn]

- name: Ensure WireGuard config directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: '0700'
  become: true
  tags: [system, vpn]

- name: Copy WireGuard configuration file based on hostname
  ansible.builtin.copy:
    src: "etc/wireguard/Peer_{{ hostname }}.conf"
    dest: "/etc/wireguard/wg0.conf"
    mode: '0600'
    owner: root
    group: root
  become: true
  notify: Restart WireGuard
  tags: [system, vpn]
  when: not deploy_without_passwords | default(false)

- name: Enable and start WireGuard service
  ansible.builtin.systemd:
    name: "wg-quick@wg0"
    enabled: true
    state: started
  become: true
  tags: [system, vpn]
