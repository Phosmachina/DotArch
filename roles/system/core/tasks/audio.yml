---
- name: Install pipewire and related packages
  community.general.pacman:
    name:
      - alsa-utils
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - pipewire-jack
      - gst-plugin-pipewire
      - libpulse
      - wireplumber
      - pulsemixer
    state: present
  become: true

- name: Start Pipewire services
  ansible.builtin.systemd:
    name: '{{ item }}'
    state: started
    enabled: true
    scope: user
  loop:
    - pipewire
    - pipewire-pulse

- name: Enable WirePlumber
  ansible.builtin.systemd:
    name: wireplumber
    state: started
    enabled: true
    scope: user
