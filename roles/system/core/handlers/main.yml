---
# Handlers for system role

- name: Generate locales
  ansible.builtin.command: locale-gen
  changed_when: true

- name: Restart WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@wg0"
    state: restarted
    daemon_reload: true
  become: true

- name: Restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
  become: true
  when: target == 'laptop'

- name: Restart systemd-vconsole-setup
  ansible.builtin.service:
    name: systemd-vconsole-setup
    state: restarted
  become: true

- name: Enable NumLock service
  ansible.builtin.systemd:
    name: numlock.service
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Disable NumLock service
  ansible.builtin.systemd:
    name: numlock.service
    enabled: false
    state: stopped
    daemon_reload: true
  become: true
