# Hyprland Keybindings Configuration

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$menu = vicinae toggle

#######################
### BASIC KEYBINDS ###
#######################

# Terminal
bind = SUPER, RETURN, exec, $terminal

# Close window
bind = SUPER, z, killactive

# Exit Hyprland
bind = SUPER SHIFT, Q, exit, 

# Reload configuration
bind = SUPER, Escape, exec, hyprctl reload

# File manager
#bind = SUPER, e, exec, yazi

# Toggle floating
bind = SUPER+SHIFT, F, togglefloating, 

# Application launcher
bind = SUPER, space, exec, $menu

# Window management
bind = SUPER+CTRL, space, exec, vicinae vicinae://extensions/vicinae/wm/switch-windows

# Emoji picker
bind = SUPER, period, exec, vicinae vicinae://extensions/vicinae/core/search-emojis

########################
### WINDOW FUNCTIONS ###
########################

# Toggle fullscreen
bind = SUPER, f, fullscreen

# Window grouping
bind = SUPER, j, togglesplit   # Toggle split
bind = SUPER, k, togglegroup   # Toggle group (tab mode)

# Focus management (Group/Tab switching)
bind = SUPER, bracketleft, changegroupactive, b
bind = SUPER, bracketright, changegroupactive, f

# Move window within group
bind = SUPER SHIFT, bracketleft, movegroupwindow, b
bind = SUPER SHIFT, bracketright, movegroupwindow, f

# Group interaction
bind = SUPER, g, moveintogroup, l    # Move into group on left
bind = SUPER, g, moveintogroup, r    # Move into group on right
bind = SUPER, g, moveintogroup, u    # Move into group on up
bind = SUPER, g, moveintogroup, d    # Move into group on down
bind = SUPER SHIFT, g, moveoutofgroup  # Move out of group

# Preselect split direction
bind = SUPER, s, submap, preselect
submap = preselect
bind = , left, layoutmsg, preselect l
bind = , left, submap, reset
bind = , right, layoutmsg, preselect r
bind = , right, submap, reset
bind = , up, layoutmsg, preselect u
bind = , up, submap, reset
bind = , down, layoutmsg, preselect d
bind = , down, submap, reset
bind = , h, layoutmsg, preselect l
bind = , h, submap, reset
bind = , l, layoutmsg, preselect r
bind = , l, submap, reset
bind = , k, layoutmsg, preselect u
bind = , k, submap, reset
bind = , j, layoutmsg, preselect d
bind = , j, submap, reset
bind = , escape, submap, reset
submap = reset

# Mouse bindings
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

######################
### FOCUS MOVEMENT ###
######################

# Basic focus movement
bind = SUPER, left, movefocus, l
bind = SUPER, down, movefocus, d
bind = SUPER, up, movefocus, u
bind = SUPER, right, movefocus, r

# Resize focused window
bind = SUPER+CONTROL, down, resizeactive, 0 -5%
bind = SUPER+CONTROL, up, resizeactive, 0 5%
bind = SUPER+CONTROL, left, resizeactive, 5% 0
bind = SUPER+CONTROL, right, resizeactive, -5% 0

# Move windows
bind = SUPER+SHIFT, left, movewindow, l
bind = SUPER+SHIFT, down, movewindow, d
bind = SUPER+SHIFT, up, movewindow, u
bind = SUPER+SHIFT, right, movewindow, r

##################
### WORKSPACES ###
##################

# Switch to workspace (using hex codes)
#bind = SUPER, 0x21, workspace, 01  # ! (exclamation mark)
#bind = SUPER, 0x40, workspace, 02  # @ (at symbol)
#bind = SUPER, 0x23, workspace, 03  # # (hash/pound)
#bind = SUPER, 0x24, workspace, 04  # $ (dollar)
#bind = SUPER, 0x25, workspace, 05  # % (percent)
#bind = SUPER, 0x5e, workspace, 06  # ^ (caret)
#bind = SUPER, 0x26, workspace, 07  # & (ampersand)
#bind = SUPER, 0x2a, workspace, 08  # * (asterisk)
#bind = SUPER, 0x28, workspace, 09  # ( (left parenthesis)
bind = SUPER, 1, workspace, 01  # ! (exclamation mark)
bind = SUPER, 2, workspace, 02  # @ (at symbol)
bind = SUPER, 3, workspace, 03  # # (hash/pound)
bind = SUPER, 4, workspace, 04  # $ (dollar)
bind = SUPER, 5, workspace, 05  # % (percent)
bind = SUPER, 6, workspace, 06  # ^ (caret)
bind = SUPER, 7, workspace, 07  # & (ampersand)
bind = SUPER, 8, workspace, 08  # * (asterisk)
bind = SUPER, 9, workspace, 09  # ( (left parenthesis)

# Move to workspace (using hex codes)
bind = SUPER+SHIFT, 1, movetoworkspace, 01  # !
bind = SUPER+SHIFT, 2, movetoworkspace, 02  # @
bind = SUPER+SHIFT, 3, movetoworkspace, 03  # #
bind = SUPER+SHIFT, 4, movetoworkspace, 04  # $
bind = SUPER+SHIFT, 5, movetoworkspace, 05  # %
bind = SUPER+SHIFT, 6, movetoworkspace, 06  # ^
bind = SUPER+SHIFT, 7, movetoworkspace, 07  # &
bind = SUPER+SHIFT, 8, movetoworkspace, 08  # *
bind = SUPER+SHIFT, 9, movetoworkspace, 09  # (

# Swap workspaces
bind = SUPER+SHIFT, s, exec, ~/.config/hypr/scripts/swap-workspaces.sh

# Navigate between workspaces
bind = SUPER+ALT, right, exec, ~/.config/hypr/scripts/workspace-cycler.sh next
bind = SUPER+ALT, left, exec, ~/.config/hypr/scripts/workspace-cycler.sh prev

# Scroll through workspaces
bind = SUPER, mouse_down, exec, ~/.config/hypr/scripts/workspace-cycler.sh next
bind = SUPER, mouse_up, exec, ~/.config/hypr/scripts/workspace-cycler.sh prev

##########################
### SPECIAL WORKSPACES ###
##########################

# Toggle special workspace (scratchpad)
bind = SUPER, grave, togglespecialworkspace, magic
bind = SUPER SHIFT, grave, movetoworkspace, special:magic

#######################
### MEDIA & VOLUME ###
#######################

# Volume controls
bind = , XF86AudioRaiseVolume, exec, sound up 1; sound notify
bind = , XF86AudioLowerVolume, exec, sound down 1; sound notify
bind = , XF86AudioMute, exec, amixer set Master toggle

# Brightness controls
bind = , XF86MonBrightnessUp, exec, sudo brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, sudo brightnessctl set 5%-

# Media controls (using play-pause script like herbstluftwm)
bind = , XF86AudioPlay, exec, play-pause
bind = , XF86AudioNext, exec, playerctl -a next
bind = , XF86AudioPrev, exec, playerctl -a previous

######################
### POWER CONTROLS ###
######################

# Power menu
bind = SUPER, x, submap, power
submap = power
binde = , p, exec, poweroff
binde = , r, exec, reboot
binde = , s, exec, systemctl suspend
binde = , s, submap, reset
binde = , l, exec, hyprlock
binde = , l, submap, reset
binde = , b, exec, hyprctl dispatch dpms toggle
binde = , b, submap, reset
bind = , catchall, submap, reset
submap = reset

#######################
### SCREENSHOT/CLIP ###
#######################

# Screenshot with hyprshot
bind = SUPER, PRINT, exec, hyprshot -m window --raw | satty --filename -
bind = , PRINT, exec, hyprshot -m output --raw | satty --filename -
bind = SUPER SHIFT, PRINT, exec, hyprshot -m region --raw | satty --filename -

# Screen recording
bind = SUPER+ALT, Print, exec, wl-screenrec -g "$(slurp)"
bind = SUPER+ALT+SHIFT, Print, exec, killall -INT wl-screenrec

# Toggle waybar
bind = SUPER+ALT, p, exec, killall -SIGUSR1 waybar

# Color picker
bind = SUPER, c, exec, hyprpicker -a

# Clipboard history
bind = SUPER, v, exec, vicinae vicinae://extensions/vicinae/clipboard/history

#####################
### NOTIFICATIONS ###
#####################

# Notification center
bind = SUPER, n, exec, swaync-client -t

# Transcript (audio recording and transcription)
bind = SUPER, a, exec, voxtype record toggle

# Video playback controls
bind = SUPER, d, submap, video-note
submap = video-note
binde = , p, exec, play-pause_video_note
binde = , r, exec, play-pause_video_from_clip
bind = , escape, submap, reset
submap = reset
