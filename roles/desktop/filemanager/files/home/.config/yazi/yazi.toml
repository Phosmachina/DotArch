# Yazi configuration file

[mgr]
# Layout
linemode = "size_and_mtime"
show_hidden = false
show_symlink = true

# Sort method
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true

# Column ratios
ratios = [1, 3, 4]

[preview]
# Tab size for text preview
tab_size = 2

# The filter used on image downscaling
image_filter = "catmull-rom"

# Quality on pre-caching images
image_quality = 90

[opener]
show = [
    { run = "xdg-open %s", orphan = true, for = "unix" },
]
edit = [
    { run = "micro %s", block = true, for = "unix" },
]
open = [
    { run = "xdg-open %s", desc = "Open" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "image/*", use = "show" },
    { mime = "video/*", use = "show" },

    # { mime = "application/json", use = "edit" },
    { url = "*.json", use = "edit" },

    # Multiple openers for a single rule
    { url = "*.html", use = ["open", "edit"] },
    
    # Fallback
    { url = "*", use = "open" },
]

[tasks]
# Micro-mode settings
micro_workers = 5

# Macro-mode settings
macro_workers = 10

# Allow larger image allocation (e.g., for >10MB files that decompress to large bitmaps)
# 1GiB = 1073741824
# Also passed to `magick -limit memory` for HEIC/AVIF/JXL previews: Q16-HDRI
# ImageMagick needs ~200MB of pixel cache for a single 12MP photo
image_alloc = 1073741824
image_bound = [0, 0]

[plugin]
prepend_previewers = [
    { mime = "application/*zip", run = "archive" },
    { mime = "application/x-tar", run = "archive" },
    { mime = "application/x-bzip2", run = "archive" },
    { mime = "application/x-7z-compressed", run = "archive" },
    { mime = "application/x-rar", run = "archive" },
    { mime = "application/x-xz", run = "archive" },
]
